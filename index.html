<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokument</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 1rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    .meta {
      font-size: 0.75rem;
      color: #666;
      text-align: right;
      line-height: 1.6;
    }

    #download-link {
      display: none;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    #wip {
      display: none;
      color: #888;
      margin-top: 3rem;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Quellen</h1>
  <div class="meta">
    Interkulturelles Mangement Business Knigge & Angebotserstellung<br>
    Cristina De Martino<br>
    Peter Graeff
  </div>
</header>

<div id="download-link">
  <a id="dl2" href="https://www.main-bvxea6i-lldeiad7yjob4.de-2.platformsh.site/uploads/Italien_Poster_FINAL_6192aca11c.pdf" target="_blank">Hier klicken um Poster anzuzeigen</a><br>
  <a id="dl" href="quellen.docx" download>Hier klicken um Quellendokument herunterzuladen</a><br>
</div>

<div id="content"></div>
<div id="wip">Work in Progress</div>

<script>
  fetch('quellen.docx')
    .then(r => { if (!r.ok) throw new Error(); return r.arrayBuffer(); })
    .then(buf => mammoth.convertToHtml({ arrayBuffer: buf }))
    .then(result => {
      document.getElementById('content').innerHTML = result.value;
      document.getElementById('download-link').style.display = 'block';
    })
    .catch(() => {
      document.getElementById('wip').style.display = 'block';
    });
</script>

</body>
</html>
